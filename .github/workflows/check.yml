name: check

on:
  push:
    branches:
      - master
      - feat/serving-interference-and-replay
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m py_compile audit_code.py bench.py compare.py configure.py receipt.py report.py rigmark staggered_metrics.py token_timeline.py replay.py replay_prepare.py replay_compare.py
